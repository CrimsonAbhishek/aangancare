    <!-- Structured Data: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Aangan Care",
      "url": "https://aangancare.com",
      "logo": "https://aangancare.com/icon-512.png",
      "description": "Aangan Care is a calm starting point for Indian families seeking funeral and cremation assistance — immediate arrangements, transport, ceremony support, and after-care.",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },

        "Funeral assistance",
        "Cremation assistance",
        "Funeral transport",
        "Ceremony support",
        "After-care arrangements"
      ],
      "sameAs": []

    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Aangan Care",
      "url": "https://aangancare.com",
      "description": "Funeral and cremation assistance for Indian families — a calm, clear starting point.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://aangancare.com/resources?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: FAQPage (Home FAQs) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What should I do first after a death?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Start by ensuring the family is together and the immediate legal or medical steps are underway. Aangan Care provides a general orientation and a clear request reference as a starting point."
          }
        },
        {
          "@type": "Question",
          "name": "Can someone coordinate from another city?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Aangan Care request flow is designed for family members arranging support remotely. Share the current location and preferred contact; a coordinator can clarify what is possible."
          }
        },
        {
          "@type": "Question",
          "name": "Does Aangan Care cover my city?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Coverage is configured location by location. Share your city in a request and availability can be checked rather than assumed."
          }
        },
        {
          "@type": "Question",
          "name": "Is there any upfront payment required?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Aangan Care does not collect any payment at the request stage. A request reference is not a booking or a charge."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: BreadcrumbList for key routes -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        { "@type": "ListItem", "position": 5, "name": "Request",   "item": "https://aangancare.com/request" }
      ]
    }
    </script>
